# EvoVid main recipe (arXiv:2605.21931), Qwen3-VL-4B-Instruct.
# Runtime paths and role-specific learning rates are supplied by scripts/*.sh.
data:
  train_files: data/evovid_preprocessed.jsonl
  val_files: data/evovid_preprocessed.jsonl
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  use_preprocessed_videos: true
  video_source_mode: preprocessed_only
  preprocessed_video_dir: data/preprocessed_videos
  val_preprocessed_video_dir: data/preprocessed_videos
  video_fps: 2.0
  video_max_frames: 16
  video_min_pixels: 50176
  video_max_pixels: 50176
  video_total_pixels: 802816
  max_prompt_length: 4096
  max_response_length: 4096
  # 16 prompts x 8 GRPO samples = effective global batch 128.
  rollout_batch_size: 16
  val_batch_size: 16
  format_prompt: examples/format_prompt/questioner_strict.jinja
  shuffle: true
  seed: 1
  filter_overlong_prompts: false

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false

worker:
  actor:
    # Multiplied by rollout.n inside the trainer: 16 x 8 = 128.
    global_batch_size: 16
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    ppo_epochs: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    use_torch_compile: true
    model:
      model_path: Qwen/Qwen3-VL-4B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
      lora:
        rank: 32
        alpha: 64
        dropout: 0.05
        target_modules: all-linear
        exclude_modules: null
        init_adapter_path: null
    optim:
      # Questioner default; Solver overrides this with 2e-6.
      lr: 1.0e-6
      betas: [0.9, 0.95]
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
      lr_scheduler_type: constant
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    n: 8
    temperature: 1.0
    top_p: 0.95
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.7
    enforce_eager: false
    enable_chunked_prefill: false
    max_model_len: 8192
    max_num_batched_tokens: 8192
    limit_images: 1
    disable_tqdm: false
    val_override_config:
      temperature: 0.01
      top_p: 0.001
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: true

  reward:
    reward_function: examples/reward_function/evo_vid_questioner_reward.py:compute_score
    reward_function_kwargs:
      solver_samples: 10
      lambda_temporal: 0.1
      diversity_distance_threshold: 0.5
      diversity_weight: 1.0
      invalid_reward: 0.0
      cleanup_result_files: true

trainer:
  total_epochs: 1000
  max_steps: 20
  project_name: evovid-main
  experiment_name: qwen3vl4b_questioner_v1
  logger: [console, file, wandb]
  nnodes: 1
  n_gpus_per_node: 8
  val_freq: -1
  val_before_train: false
  val_only: false
  run_final_validation: false
  val_generations_to_log: 0
  save_freq: 20
  save_limit: 1
  save_model_only: true
  save_checkpoint_path: outputs/models
  load_checkpoint_path: null
  find_last_checkpoint: false
